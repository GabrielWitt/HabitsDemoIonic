<ion-header>

  <ion-navbar>
    <ion-title>{{teamActual.name}}</ion-title>
  </ion-navbar>

</ion-header>


<ion-content padding>
		<div class="panel-head">
			<ion-grid>
				<ion-row>
					<ion-col col-6>
						<ion-item class="myDatos">
							<div  class="step">
								<ion-icon name="walk"></ion-icon>
							</div>
						</ion-item>
					</ion-col>
					<ion-col col-6>
							<div  class="description">
								Pasos Totales<br>
								{{teamActual.pasos}}
							</div>
					</ion-col>
				</ion-row>
			</ion-grid>
		</div>
		<ion-list>
			<ion-item-divider color="light">Miembro <span style="float:rigth">Pasos</span></ion-item-divider>
			<ng-container  *ngFor="let user of participantes">
				<ion-item>
					<ion-avatar item-start  [ngClass]="{'active': user.uid === uidUser}">
						 <img [src]="user.picture">
					</ion-avatar>
					<h2>{{user.name}}</h2>
					<p> {{teamActual.members[user.uid].last_update | timeAgo2 }}</p>
					 <span  item-end> {{teamActual.members[user.uid].pasos}}</span>
				</ion-item>
			</ng-container>
		</ion-list>
	
</ion-content>
