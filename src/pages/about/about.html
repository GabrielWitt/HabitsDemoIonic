<ion-header>

  <ion-navbar>
    <ion-title>Acerca de</ion-title>
  </ion-navbar>

</ion-header>


<ion-content padding>
    <ion-list>
        <ion-item style="text-align: center;">
          <img style="margin-bottom: 15px;" src="./assets/img/LogoHabitsOver.png">
          <h1 style="margin-bottom: 15px;">{{AboutData.name}}</h1>
        </ion-item>
        <ion-item style="display: inline-flex !important;">
          <div item-start><h2>IOS versión: </h2><p>{{AboutData.ios_ver}}</p></div>
          <div item-end><h2>Android versión: </h2><p>{{AboutData.android_ver}}</p></div> 
        </ion-item>
        <ion-item style="text-align: center;">
            <div item-start><h2>Configuracion:</h2> </div>
            <div item-end><h3>{{Mode}}</h3></div>
        </ion-item>
      </ion-list>
</ion-content>
